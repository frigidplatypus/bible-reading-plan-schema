plan:
  id: ransom-fellowship-bible-reading-plan
  name: Ransom Fellowship Bible Reading Plan
  description: 'A day-of-week Bible reading plan from Ransom Fellowship. Each day of the week has a themed
    set of books to read through: Sunday (O.T. Poetry), Monday (Pentateuch), Tuesday (O.T. History), Wednesday
    (O.T. History), Thursday (O.T. Prophets), Friday (N.T. History), Saturday (N.T. Epistles). Each week
    advances through the assigned books.'
  type: thematic
  version: '1.0'
  duration_days: -1
  schedule_type: day-of-week
  day_section:
    sunday: O.T. Poetry
    monday: Pentateuch
    tuesday: O.T. History
    wednesday: O.T. History
    thursday: O.T. Prophets
    friday: N.T. History
    saturday: N.T. Epistles
  metadata:
    tags:
    - day-of-week
    - whole-bible
    - ransom-fellowship
    source: Ransom Fellowship Bible Reading Plan, ransomfellowship.org
  features:
    allow_notes: true
    track_partial_completion: true
    catch_up_strategy: flexible
