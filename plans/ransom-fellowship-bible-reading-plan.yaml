plan:
  id: ransom-fellowship-bible-reading-plan
  name: Ransom Fellowship Bible Reading Plan
  description: 'A day-of-week Bible reading plan from Ransom Fellowship. Each day of the week has a themed set of books to
    read through: Sunday (O.T. Poetry), Monday (Pentateuch), Tuesday (O.T. History), Wednesday (O.T. History), Thursday (O.T.
    Prophets), Friday (N.T. History), Saturday (N.T. Epistles). Each week advances through the assigned books.'
