plan:
  id: "journey-through-the-bible"
  name: "Journey through the Bible"
  description: >-
    A 47-week journey through the entire Bible.
    Sunday school reading schedule v1.0; weekly handouts take precedence
    over this schedule when they differ. Weeks are split into individual
    readings as lesson handouts are incorporated.
  type: "sequential"
  version: "1.0"
  duration_days: -1
  schedule_type: "flexible"

  metadata:
    tags: ["journey-through-the-bible", "whole-bible", "weekly", "sunday-school"]

  features:
    allow_notes: true
    track_partial_completion: true
    catch_up_strategy: "flexible"

  readings:
    - id: "week-01-r001"
      sections:
        - book: "Genesis"
          chapters: [1, 2, 3, 4]
      supplementary:
        questions:
          - "What long-term consequences does humanity suffer because of their sins in these chapters?"
    - id: "week-01-r002"
      sections:
        - book: "Genesis"
          chapters: [5, 6, 7, 8]
      supplementary:
        questions:
          - "How do each of these chapters trace the further decline of humanity? (Some of them are very subtle.)"
    - id: "week-01-r003"
      sections:
        - book: "Genesis"
          chapters: [9, 10, 11]
      supplementary:
        questions:
          - "Based on these chapters, why do various nations exist in the world today? (Don't forget to consider the implications of chapter 9.)"
    - id: "week-01-r004"
      sections:
        - book: "Genesis"
          chapters: [12, 13, 14, 15]
      supplementary:
        questions:
          - "How do the promises made to Abraham answer some of the consequences of humanity's ancient wickedness?"
    - id: "week-01-r005"
      sections:
        - book: "Genesis"
          chapters: [16, 17, 18, 19, 20]
      supplementary:
        questions:
          - "In these chapters, how do the blessings on Abraham define the way God deals with His people (including you!) in contrast to the other people of the world?"
    - id: "week-01-r006"
      sections:
        - book: "Genesis"
          chapters: [21, 22, 23, 24, 25, 26]
      supplementary:
        questions:
          - "In what ways do Isaac, Rebekah, and their household share in the same blessings promised to Abraham?"
    - id: "week-02-r007"
      sections:
        - book: "Genesis"
          chapters: [27, 28, 29]
        - book: "Genesis"
          chapter_verse: "30:1-24"
      supplementary:
        questions:
          - "In these chapters, how does Jacob begin to experience the promises made to Abraham?"
    - id: "week-02-r008"
      sections:
        - book: "Genesis"
          chapters: [30, 31, 32]
        - book: "Genesis"
          chapter_verse: "33:1-20"
      supplementary:
        questions:
          - "How do these events prove God's commitment to furthering his plan through Abraham's descendants?"
    - id: "week-02-r009"
      sections:
        - book: "Genesis"
          chapters: [34, 35, 36, 37, 38]
      supplementary:
        questions:
          - "What sort of sin and folly characterize Jacob and his sons?"
    - id: "week-02-r010"
      sections:
        - book: "Genesis"
          chapters: [39, 40, 41]
      supplementary:
        questions:
          - "How much time passed between Joseph being sold into slavery and Joseph standing before Pharaoh? (Hint: Don't forget Genesis 37:2.)"
    - id: "week-02-r011"
      sections:
        - book: "Genesis"
          chapters: [42, 43, 44, 45]
      supplementary:
        questions:
          - "Why does Joseph not reveal his identity to his brothers immediately? Try to answer this question based on Joseph's actions and the attention he gives to Benjamin."
    - id: "week-02-r012"
      sections:
        - book: "Genesis"
          chapters: [46, 47, 48, 49, 50]
      supplementary:
        questions:
          - "How do the events of these chapters prepare for, or point toward, the remaining events of redemptive history?"
    - id: "week-03-r013"
      sections:
        - book: "Exodus"
          chapters: [1, 2, 3, 4]
      supplementary:
        questions:
          - "What promises made to Abraham have been fulfilled by this point in Israel’s history? Which promises have not been fulfilled?"
    - id: "week-03-r014"
      sections:
        - book: "Exodus"
          chapters: [5, 6]
      supplementary:
        questions:
          - "What sort of struggles or conflicts do Moses and Israel experience in the course of these chapters?"
    - id: "week-03-r015"
      sections:
        - book: "Exodus"
          chapters: [7, 8, 9, 10]
      supplementary:
        questions:
          - "How is the sovereignty of God, over Pharaoh and the gods of Egypt, shown more and more as the plagues progress?"
    - id: "week-03-r016"
      sections:
        - book: "Exodus"
          chapters: [11, 12, 13]
      supplementary:
        questions:
          - "Describe the ways that the last plague and the Passover foreshadow the work of Christ. (Remember last week’s lesson on typology.)"
    - id: "week-03-r017"
      sections:
        - book: "Exodus"
          chapters: [14, 15]
      supplementary:
        questions:
          - "Describe the ways that the exodus and the crossing of the Red Sea foreshadow the work of Christ. (Remember last week’s lesson on typology.)"
    - id: "week-03-r018"
      sections:
        - book: "Exodus"
          chapters: [16, 17, 18]
      supplementary:
        questions:
          - "How do the events of these chapters prepare Israel to serve the Lord in the wilderness?"
    - id: "week-04-r019"
      sections:
        - book: "Exodus"
          chapters: [19, 20]
      supplementary:
        questions:
          - "Based on this portion of scripture, how would you define, describe, or summarize the “Old Covenant” between God and Israel?"
    - id: "week-04-r020"
      sections:
        - book: "Exodus"
          chapters: [21, 22, 23, 24]
      supplementary:
        questions:
          - "Based on this portion of scripture, what is the role of Law in the “Old Covenant” between God and Israel?"
    - id: "week-04-r021"
      sections:
        - book: "Exodus"
          chapters: [25, 26, 27]
      supplementary:
        questions:
          - "In what way does the tabernacle represent a partial restoration of Eden for the people of Israel in their relationship with the Lord?"
    - id: "week-04-r022"
      sections:
        - book: "Exodus"
          chapters: [28, 29, 30, 31]
      supplementary:
        questions:
          - "This portion is full of intermediaries between God and Israel: Moses, the priests, and the craftsmen who will build the tent of worship. Consider these men and their role in light of the role of Christ as mediator."
    - id: "week-04-r023"
      sections:
        - book: "Exodus"
          chapters: [32, 33, 34, 35]
      supplementary:
        questions:
          - "How would you explain God’s change of mind in Exodus 32:14 within the context of the unchanging truths of Exodus 34:6-7?"
    - id: "week-04-r024"
      sections:
        - book: "Exodus"
          chapters: [36, 37, 38, 39, 40]
      supplementary:
        questions:
          - "In a time when paper and ink were rare and precious, why would Moses write this portion of scripture, when it is largely just a repeat of chapters 25-31?"
    - id: "week-05-r025"
      sections:
        - book: "Leviticus"
          chapters: [1, 2, 3]
      supplementary:
        questions:
          - "Based on this portion of scripture, complete the offerings chart (Burnt, Grain, Peace, Sin, Guilt): what animal, plant, etc., may be used in this offering? Is this offering more voluntary or more mandatory? What does this offering do or signify, as compared to the other four offerings? How does this offering foreshadow the work of Christ as our atonement?"
    - id: "week-05-r026"
      sections:
        - book: "Leviticus"
          chapters: [4, 5]
      supplementary:
        questions:
          - "Based on this portion of scripture, complete the offerings chart (Burnt, Grain, Peace, Sin, Guilt): what animal, plant, etc., may be used in this offering? Is this offering more voluntary or more mandatory? What does this offering do or signify, as compared to the other four offerings? How does this offering foreshadow the work of Christ as our atonement?"
    - id: "week-05-r027"
      sections:
        - book: "Leviticus"
          chapters: [6, 7]
      supplementary:
        questions:
          - "Based on this portion of scripture, complete the offerings chart (Burnt, Grain, Peace, Sin, Guilt): what animal, plant, etc., may be used in this offering? Is this offering more voluntary or more mandatory? What does this offering do or signify, as compared to the other four offerings? How does this offering foreshadow the work of Christ as our atonement?"
    - id: "week-05-r028"
      sections:
        - book: "Leviticus"
          chapters: [8, 9, 10]
      supplementary:
        questions:
          - "Based on the consecration of the priests and the death of Nadab and Abihu, what does it mean for the Lord to be holy and to treat the Lord as holy (Lev. 10:3)?"
    - id: "week-05-r029"
      sections:
        - book: "Leviticus"
          chapters: [11, 12]
      supplementary:
        questions:
          - "Two very different forms of ritual uncleanness are described in these chapters. Can you think of anything in our culture like ritual uncleanness?"
    - id: "week-05-r030"
      sections:
        - book: "Leviticus"
          chapters: [13, 14, 15]
      supplementary:
        questions:
          - "How do the laws for dealing with leprosy contrast with Christ’s treatment of lepers? See Matthew 8:1ff and Luke 17:11ff."
    - id: "week-06-r031"
      sections:
        - book: "Leviticus"
          chapters: [16, 17]
      supplementary:
        questions:
          - "This passage might be the most detail we get about atonement in Old Testament law. How do these details foreshadow the atonement made by Christ for us?"
    - id: "week-06-r032"
      sections:
        - book: "Leviticus"
          chapters: [18, 19, 20]
      supplementary:
        questions:
          - "Some Christians like to divide the various laws in the books of Moses into laws which are moral (giving moral principles), civil (administrating the nation) & ceremonial (ritual use). Do any laws in this portion seem to defy that kind of categorization?"
    - id: "week-06-r033"
      sections:
        - book: "Leviticus"
          chapters: [21, 22]
      supplementary:
        questions:
          - "Can you see any ways these laws for priests might foreshadow the priesthood or Christ, or any ways in which Christ surpasses the ministry of these priests?"
    - id: "week-06-r034"
      sections:
        - book: "Leviticus"
          chapters: [23, 24]
      supplementary:
        questions:
          - "Can you see any ways these holy days foreshadow the salvation granted by Christ, or any way in which the coming of Christ exceeds these holy days?"
    - id: "week-06-r035"
      sections:
        - book: "Leviticus"
          chapters: [25]
      supplementary:
        questions:
          - "The Sabbath year and the Jubilee are favorite topics among Christians who study typology (how Christ is foreshadowed in the Old Testament). Why do you think that is?"
    - id: "week-06-r036"
      sections:
        - book: "Leviticus"
          chapters: [26, 27]
      supplementary:
        questions:
          - "Chapter 26 offers another written summary of the Old Covenant. What does this passage emphasize about that covenant?"
    - id: "week-07-r037"
      sections:
        - book: "Numbers"
          chapters: [1, 2]
      supplementary:
        questions:
          - "The stated purpose of the census is to number the men who are able to go to war. Can you think of any other reasons for the Lord to include this information in Scripture?"
    - id: "week-07-r038"
      sections:
        - book: "Numbers"
          chapters: [3, 4, 5, 6]
      supplementary:
        questions:
          - "The Nazarite vow (chapter 6) seems like a way for non-priests to serve the Lord. How do their requirements compare to priestly requirements, as described here or elsewhere?"
    - id: "week-07-r039"
      sections:
        - book: "Numbers"
          chapters: [7, 8, 9, 10]
      supplementary:
        questions:
          - "Based on these chapters, how would you describe the current, spiritual state of Israel? Do they seem obedient or disobedient? Faithful or faithless? Reverent or blasphemous?"
    - id: "week-07-r040"
      sections:
        - book: "Numbers"
          chapters: [11, 12]
      supplementary:
        questions:
          - "What reasons are given in this portion for why people would rebel against the Lord or against Moses?"
    - id: "week-07-r041"
      sections:
        - book: "Numbers"
          chapters: [13, 14]
      supplementary:
        questions:
          - "If you have time, also read Deuteronomy 1. Based on that passage, how did the Lord demonstrate his power and willingness to give Israel victory in Canaan?"
    - id: "week-07-r042"
      sections:
        - book: "Numbers"
          chapters: [15, 16, 17]
      supplementary:
        questions:
          - "Korah’s rebellion is the fifth rebellion of Israel narrated in the span of seven chapters. How is this rebellion (and the way it is answered) different than the others?"
