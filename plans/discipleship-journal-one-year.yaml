plan:
  id: discipleship-journal-one-year
  name: The Discipleship Journal Bible Reading Plan
  description: 'A one-year Bible reading plan from The Discipleship Journal (The Navigators). Each month
    has 25 readings, with four books read in parallel: a New Testament book, a second New Testament book
    (or wisdom book), and two Old Testament books. Days 26-31 are free for catch-up or study. Start at
    any point during the year.'
  type: sequential
  version: '1.0'
  duration_days: 300
  schedule_type: calendar-generic
  metadata:
    tags:
    - one-year
    - whole-bible
    - discipleship
    - navigators
    source: The Discipleship Journal Bible Reading Plan, ©1983 The Navigators. Used by permission of NavPress.
  features:
    allow_notes: true
    track_partial_completion: true
    catch_up_strategy: flexible
