plan:
  id: shirkers-and-slackers
  name: Read through the Bible Program for Shirkers and Slackers
  description: 'A one-year Bible reading program from Ransom Fellowship. One reading per day, cycling through seven sections
    of the Bible: Sunday (O.T. Poetry), Monday (Pentateuch), Tuesday (O.T. History), Wednesday (O.T. History), Thursday (O.T.
    Prophets), Friday (N.T. History), Saturday (N.T. Epistles). Each day reads one book from that weeks section, advancing
    through the books in turn. Adapted with the help of Lulu Velga and Christine Harwood from Why Pray? by Douglas F. Kelly
    (Brentwood, TN: Wolgemuth & Hyatt, 1989) pp. 191-195.'
  type: thematic
  version: '1.0'
  duration_days: 365
  schedule_type: day-of-week
  day_section:
    sunday: O.T. Poetry
    monday: Pentateuch
    tuesday: O.T. History
    wednesday: O.T. History
    thursday: O.T. Prophets
    friday: N.T. History
    saturday: N.T. Epistles
  metadata:
    tags:
    - day-of-week
    - whole-bible
    - ransom-fellowship
    - shirkers-and-slackers
    source: Ransom Fellowship, 1150 West Center, Rochester, MN 55902
  features:
    allow_notes: true
    track_partial_completion: true
    catch_up_strategy: flexible
